add_newline = false
format = '$username$hostname$directory$git_branch$character'

[username]
show_always = true
style_user = '244'
format = '[\[$user]($style)'

[hostname]
ssh_only = false
style = '248'
format = '[@$hostname]($style)'

[directory]
style = '252'
format = '[ $path]($style)[\]](244)'
truncation_length = 1
truncate_to_repo = false
home_symbol = '~'

[git_branch]
symbol = ''
style = '244'
format = ' [$branch]($style)'

[character]
success_symbol = '[\$](244)'
error_symbol = '[\$](red)'
